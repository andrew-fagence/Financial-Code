name: All Fundamental Data Automation

on:
  schedule:
    - cron: '0 0 * * *' # USA Time
    - cron: '0 6 * * *' # JPN Time
    - cron: '0 8 * * *' # EU & UK Time
  workflow_dispatch:
    # Allows you to manually trigger the workflow from the 'Actions' tab

jobs:
  run-data-script:
    name: Automate EU Fundamental Data
    runs-on: ubuntu-latest
    # Ensures EU data only runs on manual trigger OR at 08:00 UTC
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas gspread google-auth fredapi

      - name: Create GCP Credentials file from Secret
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > forexdailybias-5ce3a8ede6c9.json

      - name: Run Fundamental Data Script
        run: |
          python fundamental_eu_data.py

  run-jpn-data-script:
    name: JPN Fundamental Data Automation
    runs-on: ubuntu-latest
    # Ensures JPN data only runs on manual trigger OR at 06:00 UTC
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * *'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Ensure this matches your preferred Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create GCP Credentials JSON file
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDENTIALS" > forexdailybias-5ce3a8ede6c9.json

      - name: Run JPN Fundamental Data Script
        run: |
          python fundamental_jpn_data.py

  update-uk-data:
    name: UK Fundamental Data Updater
    runs-on: ubuntu-latest
    # Ensures UK data only runs on manual trigger OR at 08:00 UTC
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *'
    
    steps:
      # 1. Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up the Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install the required libraries from your requirements.txt AND xlrd for .xls support
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install xlrd

      # 4. Reconstruct the GCP JSON credentials file from the GitHub Secret
      - name: Create GCP Credentials JSON file
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > forexdailybias-5ce3a8ede6c9.json

      # 5. Execute the Python script
      - name: Run UK fundamental data script
        run: python fundamental_uk_data.py

  run-automation:
    name: USA Fundamental Data Automation
    runs-on: ubuntu-latest
    # Ensures USA data only runs on manual trigger OR at 00:00 UTC
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Create GCP Credentials JSON
        run: |
          cat << 'EOF' > forexdailybias-5ce3a8ede6c9.json
          ${{ secrets.GCP_CREDENTIALS }}
          EOF
          
      - name: Run USA Fundamental Data Script
        run: |
          python fundamental_usa_data.py
