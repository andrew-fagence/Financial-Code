name: FVG Data Automation

on:
  workflow_dispatch: # Allows you to run the action manually from the Actions tab

jobs:
  run-fvg-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node Dependencies
        run: npm install @mathieuc/tradingview googleapis

      - name: Run FVG Python Script
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python fvg_code.py
