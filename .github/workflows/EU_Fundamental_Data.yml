name: Automate EU Fundamental Data

on:
  schedule:
    # Runs daily at 08:00 UTC. You can adjust the cron schedule as needed.
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows you to trigger the workflow manually from the GitHub Actions tab

jobs:
  run-data-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas gspread google-auth fredapi

      - name: Create GCP Credentials file from Secret
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > forexdailybias-5ce3a8ede6c9.json

      - name: Run Fundamental Data Script
        run: |
          python fundamental_eu_data.py
