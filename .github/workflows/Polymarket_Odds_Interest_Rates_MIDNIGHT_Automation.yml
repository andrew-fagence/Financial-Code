name: Polymarket Interest Rates MIDNIGHT Automation

on:
  workflow_dispatch:     # Allows you to trigger the workflow manually

jobs:
  run-polymarket-midnight-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread

      - name: Run Polymarket Midnight Odds Script
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python Polymarket_Odds_Interest_Rates_MIDNIGHT.py
