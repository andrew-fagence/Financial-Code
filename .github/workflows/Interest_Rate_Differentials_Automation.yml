name: Interest Rate Differentials Automation

on:
  workflow_dispatch: # Allows you to manually trigger the script from the Actions tab

jobs:
  update-spreadsheet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade pandas google-api-python-client google-auth-httplib2 google-auth-oauthlib gspread

      - name: Create Google Credentials JSON
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: echo "$GCP_CREDENTIALS" > forexdailybias-5ce3a8ede6c9.json

      - name: Run Python Script
        run: python Interest_Rate_Differentials.py
