name: JPN Fundamental Data Automation

on:
  schedule:
    # Runs automatically every day at 06:00 UTC. (Adjust the cron expression if you want a different time)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # This allows you to manually trigger the workflow from the GitHub Actions tab

jobs:
  run-jpn-data-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Ensure this matches your preferred Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create GCP Credentials JSON file
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDENTIALS" > forexdailybias-5ce3a8ede6c9.json

      - name: Run JPN Fundamental Data Script
        run: |
          python fundamental_jpn_data.py
