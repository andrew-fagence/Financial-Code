name: Real Bond Yields Automation

on:
  workflow_dispatch: # Allows you to manually trigger the run via the GitHub Actions tab

jobs:
  run-yield-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib gspread

      - name: Execute Real Bond Yields Script
        env:
          # Passes the exact contents of your JSON file housed in GitHub secrets
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python Real_Bond_Yields.py
