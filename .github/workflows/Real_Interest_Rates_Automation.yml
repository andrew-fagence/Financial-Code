name: Real Interest Rates Automation

on:
  workflow_dispatch:    # Allows you to trigger the script manually from GitHub

jobs:
  update-spreadsheet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth pandas

      - name: Run Real_Interest_Rates.py
        env:
          # Passes the GitHub secret locally to the Python script
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python Real_Interest_Rates.py
